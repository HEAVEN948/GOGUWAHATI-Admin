<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOGUWAHATI Admin</title>
<link rel="manifest" id="manifest-link">
<style>
  :root {
    --bg: #0A0A0C;
    --surface: #16151C;
    --surface-2: #1F1E27;
    --border: rgba(255,255,255,0.08);
    --purple: #6D3FC7;
    --purple-soft: rgba(109,63,199,0.18);
    --gold: #F2B705;
    --text: #F5F3FA;
    --text-dim: #9A97A8;
    --danger: #E85D5C;
    --danger-soft: rgba(232,93,92,0.14);
    --success: #37C47F;
    --success-soft: rgba(55,196,127,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
  h1,h2,h3 { font-family: 'Poppins', sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); color: #fff; padding: 18px 20px; font-weight: 700; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
  main { max-width: 600px; margin: 0 auto; padding: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 10px; background: var(--surface-2); color: var(--text); }
  input::placeholder { color: var(--text-dim); }
  button { padding: 12px 18px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-purple { background: var(--purple); color: #fff; width: 100%; padding: 14px; border-radius: 30px; font-size: 15px; }
  .btn-small { padding: 8px 14px; font-size: 13px; border-radius: 20px; }
  .btn-verify { background: var(--success); color: #06120A; }
  .btn-block { background: var(--danger); color: #1A0505; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .tab-btn { padding: 8px 16px; border-radius: 20px; border: none; background: var(--surface); color: var(--text-dim); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .tab-btn.active { background: var(--purple); color: #fff; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .badge-green { background: var(--success-soft); color: var(--success); }
  .badge-red { background: var(--danger-soft); color: var(--danger); }
  .badge-gray { background: var(--surface-2); color: var(--text-dim); }
  .driver-row { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .driver-row:last-child { border-bottom: none; }
  .driver-top { display: flex; justify-content: space-between; align-items: start; }
  .driver-name { font-weight: 700; font-size: 15px; color: var(--text); }
  .driver-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .row-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .search-box { margin-bottom: 14px; }
  .empty-state { text-align: center; padding: 30px; color: var(--text-dim); font-size: 14px; }
  .login-wrap { max-width: 360px; margin: 80px auto 0; padding: 0 20px; }
  .login-wrap .card { text-align: center; }
  .day-header { font-size: 12px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; padding: 14px 0 6px; }
  .day-header:first-child { padding-top: 0; }
</style>
</head>
<body>

<header>
  <span>🛡️ GOGUWAHATI Admin</span>
  <div style="display:flex; gap:8px; align-items:center;">
    <button id="btnInstallAdmin" title="Install App" style="background:rgba(255,255,255,0.08); border:none; width:32px; height:32px; border-radius:8px; color:#fff; font-size:15px;">📲</button>
    <button id="btnShareAdmin" title="Share App" style="background:rgba(255,255,255,0.08); border:none; width:32px; height:32px; border-radius:8px; color:#fff; font-size:15px;">🔗</button>
    <button id="btnLogout" class="btn-outline btn-small" style="display:none;">Logout</button>
  </div>
</header>

<div id="loginScreen" class="login-wrap">
  <div class="card">
    <h2 style="margin-bottom:14px;">Admin Login</h2>
    <input id="loginEmail" type="email" placeholder="Admin email">
    <input id="loginPass" type="password" placeholder="Password">
    <button class="btn-purple" id="btnLogin">Login</button>
    <div id="loginError" style="color:var(--danger); font-size:13px; margin-top:10px;"></div>
  </div>
</div>

<main id="adminMain" style="display:none;">
  <div class="tabs">
    <button class="tab-btn active" data-tab="drivers" onclick="switchAdminTab('drivers')">Drivers</button>
    <button class="tab-btn" data-tab="recharges" onclick="switchAdminTab('recharges')">Pass Requests</button>
    <button class="tab-btn" data-tab="rides" onclick="switchAdminTab('rides')">Active Rides</button>
  </div>
  <div id="panel-drivers"></div>
  <div id="panel-recharges" style="display:none;"></div>
  <div id="panel-rides" style="display:none;"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAGk0uKDDBmSb-IaXRyk2cYp8FfVyhm1w4",
  authDomain: "goguwahati-bf146.firebaseapp.com",
  databaseURL: "https://goguwahati-bf146-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "goguwahati-bf146",
  storageBucket: "goguwahati-bf146.firebasestorage.app",
  messagingSenderId: "931264152406",
  appId: "1:931264152406:web:cd9c56f402a13e12088cf7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

const PASS_DURATION_MS = 24 * 60 * 60 * 1000;

const loginScreen = document.getElementById('loginScreen');
const adminMain = document.getElementById('adminMain');
const btnLogout = document.getElementById('btnLogout');

auth.onAuthStateChanged(user => {
  if (user && !user.isAnonymous) {
    loginScreen.style.display = 'none';
    adminMain.style.display = 'block';
    btnLogout.style.display = 'inline-block';
    loadDrivers();
    loadRecharges();
    loadActiveRides();
  } else {
    loginScreen.style.display = 'block';
    adminMain.style.display = 'none';
    btnLogout.style.display = 'none';
  }
});

document.getElementById('btnLogin').addEventListener('click', () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent = '';
  auth.signInWithEmailAndPassword(email, pass).catch(err => {
    document.getElementById('loginError').textContent = 'Login failed: ' + err.message;
  });
});

btnLogout.addEventListener('click', () => auth.signOut());

function switchAdminTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('panel-drivers').style.display = tab === 'drivers' ? 'block' : 'none';
  document.getElementById('panel-recharges').style.display = tab === 'recharges' ? 'block' : 'none';
  document.getElementById('panel-rides').style.display = tab === 'rides' ? 'block' : 'none';
}

// ================= DRIVERS =================
function loadDrivers() {
  db.ref('drivers').on('value', snapshot => {
    const drivers = snapshot.val() || {};
    renderDrivers(drivers);
  });
}

function renderDrivers(drivers) {
  const panel = document.getElementById('panel-drivers');
  const entries = Object.entries(drivers).filter(([id, d]) => d.name);
  if (entries.length === 0) {
    panel.innerHTML = `<div class="card"><div class="empty-state">No registered drivers yet</div></div>`;
    return;
  }
  panel.innerHTML = `
    <div class="card search-box">
      <input id="driverSearch" placeholder="Search by name or phone…" oninput="filterDrivers(this.value)">
    </div>
    <div class="card" id="driversListCard">
      ${entries.map(([id, d]) => driverRowHtml(id, d)).join('')}
    </div>
  `;
}

function driverRowHtml(id, d) {
  const oneYearMs = 365 * 24 * 60 * 60 * 1000;
  const verificationStillValid = d.verified && d.verifiedAt && (Date.now() - d.verifiedAt) < oneYearMs;
  const verifiedBadge = d.verified
    ? (d.verifiedAt
        ? (verificationStillValid
            ? `<span class="badge badge-green">Verified (until ${new Date(d.verifiedAt + oneYearMs).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'})})</span>`
            : `<span class="badge badge-red">Verification Expired</span>`)
        : '<span class="badge badge-green">Verified</span>')
    : '<span class="badge badge-gray">Unverified</span>';
  const blockedBadge = d.blocked ? '<span class="badge badge-red">Blocked</span>' : '';
  const passActive = d.passExpiresAt && d.passExpiresAt > Date.now();
  const passBadge = passActive ? '<span class="badge badge-green">Pass Active</span>' : '<span class="badge badge-gray">No Active Pass</span>';
  const onlineBadge = d.online ? '<span class="badge badge-green">Online</span>' : '';
  const photoHtml = d.photoBase64
    ? `<img src="${d.photoBase64}" style="width:48px; height:48px; border-radius:50%; object-fit:cover; margin-right:12px;">`
    : `<div style="width:48px; height:48px; border-radius:50%; background:var(--purple-soft); color:var(--purple); display:flex; align-items:center; justify-content:center; font-weight:700; margin-right:12px;">${(d.name||'?').charAt(0)}</div>`;

  return `
    <div class="driver-row" data-name="${(d.name||'').toLowerCase()}" data-phone="${d.phone||''}">
      <div class="driver-top">
        <div style="display:flex; align-items:center;">
          ${photoHtml}
          <div>
            <div class="driver-name">${d.name}</div>
            <div class="driver-meta">${d.phone} · ${d.vehicle || '—'} · ${d.vehicleType || '—'}</div>
          </div>
        </div>
      </div>
      <div style="margin-top:8px;">${verifiedBadge} ${blockedBadge} ${passBadge} ${onlineBadge}</div>
      <div class="row-actions">
        ${verificationStillValid
          ? `<button class="btn-small btn-outline" onclick="setDriverField('${id}','verified',false)">Unverify</button>`
          : `<button class="btn-small btn-verify" onclick="verifyDriver('${id}')">${d.verified ? 'Re-verify' : 'Verify'}</button>`
        }
        ${d.blocked
          ? `<button class="btn-small btn-verify" onclick="setDriverField('${id}','blocked',false)">Unblock</button>`
          : `<button class="btn-small btn-block" onclick="confirmBlock('${id}','${d.name}')">Block</button>`
        }
        <button class="btn-small btn-outline" onclick="grantPass('${id}')">Grant 24hr Pass</button>
        <a class="btn-small btn-outline" style="text-decoration:none;" href="tel:${d.phone}">Call</a>
        <a class="btn-small btn-outline" style="text-decoration:none;" href="https://wa.me/${d.phone}" target="_blank">WhatsApp</a>
      </div>
    </div>
  `;
}

function filterDrivers(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.driver-row').forEach(row => {
    const matches = row.dataset.name.includes(q) || row.dataset.phone.includes(q);
    row.style.display = matches ? 'block' : 'none';
  });
}

function setDriverField(id, field, value) {
  db.ref('drivers/' + id).update({ [field]: value });
}

function verifyDriver(id) {
  db.ref('drivers/' + id).update({ verified: true, verifiedAt: Date.now() });
}

function confirmBlock(id, name) {
  if (confirm(`Block ${name}? They will be locked out immediately.`)) {
    setDriverField(id, 'blocked', true);
  }
}

function grantPass(id) {
  db.ref('drivers/' + id).update({ passExpiresAt: Date.now() + PASS_DURATION_MS });
  alert('24-hour pass granted.');
}

// ================= RECHARGE REQUESTS (daily-grouped, auto-archiving) =================
function loadRecharges() {
  // Only ever shows PENDING requests. Confirmed/rejected ones are moved out
  // to rechargeRequestsArchive (see confirmRecharge/rejectRecharge below),
  // so this list never fills up with old, already-handled requests.
  db.ref('rechargeRequests').orderByChild('status').equalTo('pending').on('value', snapshot => {
    renderRecharges(snapshot.val());
  });
}

function dayLabel(ts) {
  if (!ts) return 'Undated';
  const d = new Date(ts);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return 'Today';
  if (sameDay(d, yest)) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function renderRecharges(requests) {
  const panel = document.getElementById('panel-recharges');
  if (!requests) {
    panel.innerHTML = `<div class="card"><div class="empty-state">No pending pass requests</div></div>`;
    return;
  }
  const entries = Object.entries(requests).sort((a,b) => (b[1].submittedAt||0) - (a[1].submittedAt||0));

  // group by day
  const groups = {};
  entries.forEach(([id, r]) => {
    const label = dayLabel(r.submittedAt);
    if (!groups[label]) groups[label] = [];
    groups[label].push([id, r]);
  });

  let html = `<div class="card">`;
  Object.entries(groups).forEach(([label, items]) => {
    html += `<div class="day-header">${label} · ${items.length} request${items.length > 1 ? 's' : ''}</div>`;
    html += items.map(([id, r]) => `
      <div class="driver-row">
        <div class="driver-top">
          <div>
            <div class="driver-name">${r.driverName}</div>
            <div class="driver-meta">${r.driverPhone} · ₹${r.amount}${r.txnRef ? ' · Ref: ' + r.txnRef : ' · No reference given'}</div>
          </div>
        </div>
        <div class="row-actions">
          <button class="btn-small btn-verify" onclick="confirmRecharge('${id}','${r.driverId}')">Confirm &amp; Activate</button>
          <button class="btn-small btn-block" onclick="rejectRecharge('${id}')">Reject</button>
        </div>
      </div>
    `).join('');
  });
  html += `</div>`;
  panel.innerHTML = html;
}

function archiveAndRemove(rechargeId, extraFields) {
  db.ref('rechargeRequests/' + rechargeId).once('value').then(snap => {
    const data = snap.val();
    if (!data) return;
    db.ref('rechargeRequestsArchive/' + rechargeId).set({ ...data, ...extraFields });
    db.ref('rechargeRequests/' + rechargeId).remove();
  });
}

function confirmRecharge(rechargeId, driverId) {
  db.ref('drivers/' + driverId).update({ passExpiresAt: Date.now() + PASS_DURATION_MS });
  archiveAndRemove(rechargeId, { status: 'confirmed', confirmedAt: Date.now() });
}

function rejectRecharge(rechargeId) {
  archiveAndRemove(rechargeId, { status: 'rejected', rejectedAt: Date.now() });
}

// ================= ACTIVE RIDES =================
function loadActiveRides() {
  db.ref('rideRequests').on('value', snapshot => {
    const all = snapshot.val() || {};
    const active = Object.entries(all).filter(([id, r]) => ['requested','accepted','in_progress'].includes(r.status));
    renderActiveRides(active);
  });
}

function renderActiveRides(rides) {
  const panel = document.getElementById('panel-rides');
  if (rides.length === 0) {
    panel.innerHTML = `<div class="card"><div class="empty-state">No active rides right now</div></div>`;
    return;
  }
  panel.innerHTML = `<div class="card">${rides.map(([id, r]) => `
    <div class="driver-row">
      <div class="driver-top">
        <div>
          <div class="driver-name">${r.riderName} → ${r.driverName || 'unassigned'}</div>
          <div class="driver-meta">${r.pickup} → ${r.destination} · ₹${r.agreedFare || r.fareOffer}</div>
        </div>
        <span class="badge badge-gray">${r.status.replace('_',' ')}</span>
      </div>
    </div>
  `).join('')}</div>`;
}

// ================= INSTALL / SHARE =================
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
});

document.getElementById('btnInstallAdmin').addEventListener('click', async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  } else {
    alert('App may already be installed, or on iPhone: tap Share in Safari, then "Add to Home Screen".');
  }
});

document.getElementById('btnShareAdmin').addEventListener('click', () => {
  const shareData = { title: 'GOGUWAHATI Admin', url: window.location.href };
  if (navigator.share) {
    navigator.share(shareData).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert('Link copied to clipboard!');
  }
});

// ================= PWA MANIFEST (shield + car icon, admin variant) =================
const adminIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0A0A0C"/>
  <path d="M256 90 L400 140 L400 260 Q400 380 256 430 Q112 380 112 260 L112 140 Z" fill="#6D3FC7" opacity="0.6"/>
  <path d="M180 260 L230 310 L340 190" stroke="#F2B705" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
const manifest = {
  name: "GOGUWAHATI Admin",
  short_name: "GG Admin",
  start_url: ".",
  display: "standalone",
  background_color: "#0A0A0C",
  theme_color: "#0A0A0C",
  icons: [{
    src: "data:image/svg+xml," + encodeURIComponent(adminIconSvg),
    sizes: "512x512",
    type: "image/svg+xml"
  }]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

// ================= SERVICE WORKER =================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
}
</script>
</body>
</html>
